<svg width="860" height="260" viewBox="0 0 860 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HappyMac">
  <!-- 背景（深夜炭蓝） -->
  <rect width="860" height="260" fill="#14161C"/>

  <!-- 雷达波纹（左侧装饰， HappyMac 在感知你） -->
  <path d="M 62 130 Q 78 114 62 98" stroke="#7FA6DC" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M 44 140 Q 68 114 44 88" stroke="#7FA6DC" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.48"/>
  <path d="M 26 150 Q 60 114 26 78" stroke="#7FA6DC" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.26"/>

  <!-- 经典 Macintosh 128K -->
  <g>
    <!-- 机身（米色圆角，暗夜里依旧暖） -->
    <rect x="102" y="36" width="150" height="180" rx="14" fill="#D6CBB2" stroke="#0B0E14" stroke-width="5"/>
    <!-- 屏幕暗腔 -->
    <rect x="116" y="56" width="122" height="94" rx="8" fill="#0B0E14" opacity="0.9"/>
    <!-- 屏幕 -->
    <rect x="121" y="61" width="112" height="84" rx="5" fill="#11131F"/>
    <!-- HappyMac 像素脸：开心 ^ ^ 眼 + 大微笑 -->
    <path d="M 144 94 Q 152 84 160 94" stroke="#F5F1E4" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 194 94 Q 202 84 210 94" stroke="#F5F1E4" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 150 112 Q 177 138 204 112" stroke="#F5F1E4" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- 软驱槽 -->
    <rect x="132" y="168" width="90" height="9" rx="3" fill="#0B0E14" opacity="0.85"/>
    <!-- 下巴小字 -->
    <text x="177" y="200" font-family="Verdana, sans-serif" font-size="11" fill="#3A3325" text-anchor="middle" opacity="0.85">HappyMac</text>
  </g>

  <!-- 字标 -->
  <text x="292" y="138" font-family="Verdana, 'PingFang SC', sans-serif" font-size="70" font-weight="bold" fill="#F0EEE4" letter-spacing="1">HappyMac</text>
  <!-- 标语 -->
  <text x="298" y="180" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#9BA0B0">它不是工具，它只是在陪着你。</text>

  <!-- 小星星（右上装饰） -->
  <g fill="#7FA6DC">
    <path d="M 642 50 l 5.5 15 15 5.5 -15 5.5 -5.5 15 -5.5 -15 -15 -5.5 15 -5.5 z"/>
    <circle cx="678" cy="40" r="4.5" opacity="0.85"/>
    <circle cx="700" cy="72" r="3" opacity="0.55"/>
  </g>
</svg>
